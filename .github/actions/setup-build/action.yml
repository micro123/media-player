name: Set up Android build
description: Set up the pinned JDK, Android SDK and Gradle cache.
inputs:
  cache-read-only:
    description: Keep signing builds from writing Gradle caches.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Java 25
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '25'
    - name: Set up Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
        log-accepted-android-sdk-licenses: 'false'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-provider: basic
        cache-read-only: ${{ inputs.cache-read-only }}
        dependency-graph: disabled
