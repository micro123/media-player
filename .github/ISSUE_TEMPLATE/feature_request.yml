name: 功能建议
description: 描述希望改进的使用场景
title: '[Feature] '
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与当前问题
      description: 说明何时需要这个功能，以及目前的操作有什么不便。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 可附交互示例或替代方案。
    validations:
      required: true
