name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      draft: ${{ steps.metadata.outputs.draft }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and version
        id: metadata
        run: python3 tools/ci/release-metadata.py
      - name: Set up build tools
        uses: ./.github/actions/setup-build
        with:
          cache-read-only: 'true'
      - name: Test release source
        run: >-
          ./gradlew :app:testDebugUnitTest :app:lintDebug
          --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
          --no-configuration-cache --console=plain --no-daemon
      - name: Package corresponding native sources
        run: bash tools/ci/package-native-source.sh
      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tools/ci/prepare-signing.py
      - name: Build signed release APK
        run: >-
          ./gradlew :app:assembleRelease --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          --no-configuration-cache --console=plain --no-daemon
      - name: Verify and package release
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: python3 tools/ci/package-release.py
      - name: Upload verified release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release
          path: build/release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Remove signing files
        if: always()
        shell: bash
        run: rm -f keystore.properties .signing/media-player-release.keystore

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          DRAFT_RELEASE: ${{ needs.build.outputs.draft }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This tag already has a release; refusing to replace published assets.' >&2
            exit 1
          fi
          args=(--verify-tag --title "Media Player $RELEASE_TAG" --generate-notes --notes-file release/RELEASE_NOTES.md)
          if [[ "$PRERELEASE" == 'true' ]]; then
            args+=(--prerelease)
          fi
          if [[ "$DRAFT_RELEASE" == 'true' ]]; then
            args+=(--draft)
          fi
          gh release create "$RELEASE_TAG" release/*.apk release/SHA256SUMS release/*-mapping.zip release/*-source.tar.gz release/BUILD_INFO.json "${args[@]}"
